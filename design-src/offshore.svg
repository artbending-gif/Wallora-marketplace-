<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <rect width="1200" height="1600" fill="#f7eed7"/>

  <!-- ================= hand-lettered OFFSHORE ================= -->
  <g fill="#2c4a6e" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">
    <text transform="translate(148 536) rotate(-8)" font-size="244">O</text>
    <text transform="translate(300 512) rotate(-5)" font-size="206">F</text>
    <text transform="translate(404 506) rotate(-4)" font-size="210">F</text>
    <text transform="translate(508 500) rotate(-3)" font-size="220">S</text>
    <text transform="translate(620 496) rotate(-1)" font-size="214">H</text>
    <text transform="translate(744 492) rotate(1)" font-size="202">O</text>
    <text transform="translate(846 486) rotate(3)" font-size="218">R</text>
    <text transform="translate(962 482) rotate(5)" font-size="210">E</text>
  </g>

  <!-- ================= canoe ================= -->
  <g stroke="#2c4a6e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 1064 C300 1008 416 958 552 922 C688 886 812 864 892 864
